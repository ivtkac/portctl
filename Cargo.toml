[package]
name = "portctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "portctl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "default-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.10.0"
thiserror = "2.0.18"
serde_json = "1.0.149"
features = "0.10.0"
clap = { version = "4.5.59", features = ["derive", "env"] }
anyhow = "1.0.101"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio-util = "0.7.18"
toml = "1.0.3"
dirs = "6.0.0"
